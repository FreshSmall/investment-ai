# 运行配置：模型档位/预算/流水线参数/vault 路径。凭证一律走 .env，此处支持 ${VAR:default} 占位符。

vault_path: ${IAI_VAULT_PATH:/Users/bjhl/GitRepository/Investment-KB}

news_providers: [cls, eastmoney]

pipeline:
  lookback_hours: 26          # 采集回看窗口（重叠窗口 + 幂等去重兜底，无需水位表）
  classify_batch_size: 12     # L1 分类每批事件数（批输出 JSON 约需 1.5~2K tokens）
  watchdog_minutes: 30        # 单次 pipeline 总时长熔断
  llm_timeout_seconds: 60
  daily_p1_cap: 30            # 日报渲染 P1 条数上限（按发布时间取前 N；P0 不设限），超出部分在日报尾部提示条数
  l0_min_content_hits: 2      # L0 过滤：正文-only 命中需 ≥N 个不同行业关键词（标题命中仍然放行）
  near_dup_hours: 48          # 同题归并：与近 N 小时已入库事件+本批内候选做标题相似度比对
  near_dup_jaccard: 0.6       # 标题 bigram Jaccard 阈值（2026-09-17 实测 307 标题校准）
  near_dup_lcs_chars: 10      # 最长公共子串阈值，双条件防"早/晚间新闻精选"类栏目误合并

llm:
  # 全 DeepSeek（api.deepseek.com/v1 + .env 的 LLM_API_KEY）
  # 三档分层（架构 §7）：L1 便宜档分类 / L2 标准档分析 / L3 旗舰档复盘（V0.5 起）
  tiers:
    L1: {model: deepseek-flash, temperature: 0.1, max_tokens: 2000}
    L2: {model: deepseek-chat, temperature: 0.3, max_tokens: 2500}
    L3: {model: deepseek-v4-pro, temperature: 0.3, max_tokens: 4000}
  prices:                     # ¥/百万 token（以 DeepSeek 官方定价页为准）
    deepseek-flash: {input_per_m: 1.0, output_per_m: 2.0}
    deepseek-chat: {input_per_m: 4.0, output_per_m: 16.0}
    deepseek-v4-pro: {input_per_m: 8.0, output_per_m: 24.0}
  min_call_interval_seconds: 2  # LLM 串行调用最小间隔（防 RPM 限流）
  daily_budget_cny: 5.0         # 当日 LLM 成本熔断线
