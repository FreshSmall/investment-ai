# 运行配置：模型档位/预算/流水线参数/vault 路径。凭证一律走 .env，此处支持 ${VAR:default} 占位符。

vault_path: ${IAI_VAULT_PATH:~/Investment-KB}

news_providers: [cls, eastmoney]

pipeline:
  lookback_hours: 26          # 采集回看窗口（重叠窗口 + 幂等去重兜底，无需水位表）
  classify_batch_size: 20     # L1 分类每批事件数
  watchdog_minutes: 30        # 单次 pipeline 总时长熔断
  llm_timeout_seconds: 60

llm:
  tiers:
    L1: {model: glm-4.7-flash, temperature: 0.1, max_tokens: 1000}
    L2: {model: deepseek-chat, temperature: 0.3, max_tokens: 2500}
    L3: {model: glm-5, temperature: 0.3, max_tokens: 4000}
  prices:                     # ¥/百万 token（2026-09 参考价；调整只改此文件）
    glm-4.7-flash: {input_per_m: 0.0, output_per_m: 0.0}
    deepseek-chat: {input_per_m: 4.0, output_per_m: 16.0}
    glm-5: {input_per_m: 8.0, output_per_m: 24.0}
  daily_budget_cny: 10.0      # 当日 LLM 成本熔断线
