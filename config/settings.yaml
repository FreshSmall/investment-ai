# 运行配置：模型档位/预算/流水线参数/vault 路径。凭证一律走 .env，此处支持 ${VAR:default} 占位符。

vault_path: ${IAI_VAULT_PATH:/Users/bjhl/GitRepository/Investment-KB}

news_providers: [cls, eastmoney]

pipeline:
  lookback_hours: 26          # 采集回看窗口（重叠窗口 + 幂等去重兜底，无需水位表）
  classify_batch_size: 12     # L1 分类每批事件数（批输出 JSON 约需 1.5~2K tokens）
  watchdog_minutes: 30        # 单次 pipeline 总时长熔断
  llm_timeout_seconds: 60

llm:
  # 全 GLM（智谱 BigModel，OpenAI 兼容端点：open.bigmodel.cn/api/paas/v4 + .env 的 LLM_API_KEY）
  # 三档分层（架构 §7）：L1 免费档分类 / L2 标准档分析 / L3 旗舰档复盘（V0.5 起）
  tiers:
    L1: {model: glm-4.7-flash, temperature: 0.1, max_tokens: 3000}
    L2: {model: glm-5.3, temperature: 0.3, max_tokens: 5000}
    L3: {model: glm-5.3, temperature: 0.3, max_tokens: 6000}
  prices:                     # ¥/百万 token（以 bigmodel.cn/pricing 为准，此处估值用于熔断）
    glm-4.7-flash: {input_per_m: 0.0, output_per_m: 0.0}
    glm-5.3: {input_per_m: 8.0, output_per_m: 24.0}   # 估值，以 bigmodel.cn/pricing 为准
  min_call_interval_seconds: 5  # LLM 串行调用最小间隔（GLM 免费档限流严格，防 429）
  daily_budget_cny: 10.0        # 当日 LLM 成本熔断线（flash 免费后主要约束 L2）
